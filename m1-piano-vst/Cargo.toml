[workspace]
members = ["xtask"]

[package]
name = "house_piano"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Turns a clean acoustic piano (e.g. Keyscape) into a bright, M1-style house piano"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
